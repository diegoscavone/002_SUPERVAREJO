server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para ganho de performance mobile
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # 1. Service Worker & Manifest (Zero Cache + Escopo Permitido)
    location ~* ^/(sw\.js|manifest\.webmanifest|manifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Service-Worker-Allowed "/";
        expires off;
        try_files $uri =404;
    }

    # 2. Assets estáticos versionados pelo Vite (Cache longo e seguro)
    location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|webp|avif|svg|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 3. Roteamento SPA (React Router) + No-Cache no index.html
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Opcional: silenciar logs de favicon e robots se não existirem
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}