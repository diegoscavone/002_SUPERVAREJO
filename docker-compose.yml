version: '3.8'

services:
  # --- INFRA DE PROXY E SSL ---
  proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: supervarejo_teste-proxy
    restart: always
    ports:
      - '80:80'    # Entrada HTTP (Essencial para Let's Encrypt)
      - '443:443'  # Entrada HTTPS (Onde os celulares e Push conectam)
      - '81:81'    # Painel Administrativo
    volumes:
      - ./proxy/data:/data
      - ./proxy/letsencrypt:/etc/letsencrypt
    networks:
      - supervarejo-net

  # --- FRONTEND ---
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: supervarejo_teste-web-ssl
    restart: always
    networks:
      - supervarejo-net

  # --- BANCO DE DADOS ---
  db:
    image: postgres:15-alpine
    container_name: supervarejo_teste-db-ssl
    restart: always
    environment:
      POSTGRES_USER: diego
      POSTGRES_PASSWORD: princesa@33
      POSTGRES_DB: princesa
    volumes:
      - pgdata_ssl:/var/lib/postgresql/data
    networks:
      - supervarejo-net

  # --- API PRINCIPAL ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: supervarejo_teste-api-ssl
    shm_size: '1gb'
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=diego
      - DB_PASSWORD=princesa@33
      - DB_DATABASE_PROD=princesa
      # Configurações de Web Push (VAPID)
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL}
    volumes:
      - posters_data_ssl:/app/src/database
      - uploads_ssl:/app/src/tmp/uploads
    restart: always
    networks:
      - supervarejo-net

  # --- API ERP ---
  api-erp:
    build:
      context: ./api-erp
      dockerfile: Dockerfile
    container_name: supervarejo_teste-erp-ssl
    network_mode: host
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - DB_HOST=127.0.0.1
      - DB_PORT=5432
      - DB_USER=diegoscavone
      - DB_PASSWORD=princesa@33
      - DB_DATABASE=erp
    restart: always

volumes:
  posters_data_ssl:
  uploads_ssl:
  pgdata_ssl:

networks:
  supervarejo-net:
    driver: bridge